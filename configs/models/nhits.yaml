display_name: N-HiTS
family: mlp
adapter: neuralforecast
reference: "Challu et al., N-HiTS: Neural Hierarchical Interpolation for Time Series Forecasting, AAAI 2023."
notes: "tuned (20-trial random search, docs/protocol.md)"
params:
  model: NHITS
  loss: mqloss               # multi-quantile pinball loss at task.taus
  lookback_hours: 168
  exogenous: false
  calendar: true
  target: level
  scaler_type: standard
  mlp_units: [[256, 256], [256, 256], [256, 256]]
  dropout_prob_theta: 0.1
  learning_rate: 0.001
  # fixed training budget, identical for all trained models (docs/protocol.md)
  max_steps: 2000
  windows_batch_size: 256
  batch_size: 32
  val_check_steps: 25
  early_stop_patience_steps: 12
task_params:
  mit-5min-1h: {lookback_hours: 24}
  mit-15min-4h: {lookback_hours: 72}
search:
  scheduler: exogenous
  calendar: calendar
  target: target
  scaler: scaler_type
  lr: learning_rate
  lookback: lookback_hours
  dropout: dropout_prob_theta
  size:
    small: {mlp_units: [[128, 128], [128, 128], [128, 128]]}
    medium: {mlp_units: [[256, 256], [256, 256], [256, 256]]}
    large: {mlp_units: [[512, 512], [512, 512], [512, 512]]}

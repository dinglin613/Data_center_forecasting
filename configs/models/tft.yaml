display_name: TFT
family: transformer
adapter: neuralforecast
reference: "Lim et al., Temporal Fusion Transformers for interpretable multi-horizon time series forecasting, IJF 2021."
notes: "tuned (20-trial random search, docs/protocol.md)"
params:
  model: TFT
  loss: mqloss
  lookback_hours: 168
  exogenous: false
  calendar: true
  target: level
  scaler_type: standard
  hidden_size: 64
  n_head: 4
  dropout: 0.1
  learning_rate: 0.001
  # fixed training budget, identical for all trained models (docs/protocol.md)
  max_steps: 2000
  windows_batch_size: 256
  inference_windows_batch_size: 128   # batching only; avoids GPU OOM for long lookbacks
  batch_size: 32
  val_check_steps: 25
  early_stop_patience_steps: 12
task_params:
  mit-5min-1h: {lookback_hours: 24}
  mit-15min-4h: {lookback_hours: 72}
search:
  scheduler: exogenous
  calendar: calendar
  target: target
  scaler: scaler_type
  lr: learning_rate
  lookback: lookback_hours
  dropout: dropout
  size:
    small: {hidden_size: 32}
    medium: {hidden_size: 64}
    large: {hidden_size: 128}

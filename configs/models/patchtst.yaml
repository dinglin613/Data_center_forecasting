display_name: PatchTST
family: transformer
adapter: neuralforecast
reference: "Nie et al., A Time Series is Worth 64 Words: Long-term Forecasting with Transformers, ICLR 2023."
notes: "tuned (20-trial random search); univariate in NeuralForecast, no scheduler or calendar inputs"
params:
  model: PatchTST
  loss: mqloss
  lookback_hours: 168
  exogenous: false           # not supported by NeuralForecast PatchTST
  calendar: true             # not supported, ignored
  target: level
  scaler_type: standard
  patch_len: 16
  stride: 8
  hidden_size: 128
  linear_hidden_size: 256
  n_heads: 4
  dropout: 0.1
  learning_rate: 0.0001
  # fixed training budget, identical for all trained models (docs/protocol.md)
  max_steps: 2000
  windows_batch_size: 256
  inference_windows_batch_size: 128   # batching only; avoids GPU OOM for long lookbacks
  batch_size: 32
  val_check_steps: 25
  early_stop_patience_steps: 12
task_params:
  mit-5min-1h: {lookback_hours: 24}
  mit-15min-4h: {lookback_hours: 72}
search:
  scheduler: exogenous
  calendar: calendar
  target: target
  scaler: scaler_type
  lr: learning_rate
  lookback: lookback_hours
  dropout: dropout
  size:
    small: {hidden_size: 64, linear_hidden_size: 128}
    medium: {hidden_size: 128, linear_hidden_size: 256}
    large: {hidden_size: 256, linear_hidden_size: 512}

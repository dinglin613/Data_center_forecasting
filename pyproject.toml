[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dcgridbench"
version = "0.1.0"
description = "Grid-oriented probabilistic load forecasting benchmark for AI data centers"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "numpy", "pandas", "pyarrow", "scipy", "scikit-learn",
  "lightgbm", "pyyaml", "requests", "tqdm", "matplotlib",
]

[project.optional-dependencies]
deep = ["torch"]
# External SOTA models; versions match scripts/slurm/build_env.sbatch (torch 2.6).
external = ["torch", "neuralforecast==3.1.9", "chronos-forecasting==2.3.2", "gluonts==0.16.2", "pyyaml"]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["dcgridbench*"]
